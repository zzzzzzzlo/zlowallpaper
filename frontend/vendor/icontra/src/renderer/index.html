<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icontra</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="dock-root" class="dock-root" data-orientation="horizontal" aria-label="Icontra 应用 Dock">
      <section id="dock" class="dock" aria-label="应用快捷方式">
        <div id="apps" class="apps"></div>
        <div id="empty-actions" class="dock-actions" hidden>
          <button id="add-button" class="control-button" type="button" aria-label="添加应用" title="添加应用">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </div>
        <button id="hide-button" class="dock-item hide-button" type="button" aria-label="收起图标栏" title="收起图标栏" hidden>
          <span class="hide-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="m5 7 5 5-5 5M19 7l-5 5 5 5" />
            </svg>
          </span>
          <span class="control-reflection-mask" aria-hidden="true">
            <span class="control-reflection">
              <svg viewBox="0 0 24 24">
                <path d="m5 7 5 5-5 5M19 7l-5 5 5 5" />
              </svg>
            </span>
          </span>
        </button>
        <button id="desktop-icons-button" class="dock-item desktop-icons-button" type="button" aria-label="隐藏桌面图标" title="隐藏桌面图标" hidden>
          <span class="desktop-icons-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3.5" y="4.5" width="17" height="11.5" rx="1.5" />
              <path d="M8 20h8M12 16v4" />
              <path class="desktop-icons-slash" d="m4 4 16 16" />
            </svg>
          </span>
          <span class="control-reflection-mask" aria-hidden="true">
            <span class="control-reflection">
              <svg viewBox="0 0 24 24">
                <rect x="3.5" y="4.5" width="17" height="11.5" rx="1.5" />
                <path d="M8 20h8M12 16v4" />
                <path class="desktop-icons-slash" d="m4 4 16 16" />
              </svg>
            </span>
          </span>
        </button>
        <button id="restore-button" class="restore-button" type="button" aria-label="展开图标栏" title="展开图标栏">
          <span class="restore-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="m10 7-5 5 5 5M14 7l5 5-5 5" />
            </svg>
          </span>
        </button>
      </section>
      <div class="drag-zone" title="按住这里拖动 Icontra" aria-label="拖动 Icontra"></div>
    </main>
    <script src="layout-state.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
